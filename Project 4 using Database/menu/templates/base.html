{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurant{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'menu/css/style.css' %}">
</head>
<body>
    <header>
        <div class="brand">🍽️ The Rusty Fork</div>
        <nav>
            <a href="{% url 'menu' %}">Menu</a>
            <a href="{% url 'cart' %}">Cart {% if cart_count %}<span class="badge">{{ cart_count }}</span>{% endif %}</a>
            <a href="{% url 'orders' %}">Orders</a>
            <a href="{% url 'stats' %}">Stats</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>Project 4 - Django with a relational database</footer>
</body>
</html>
